name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Jerru.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jerru.apk
          path: Jerru.apk
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Jerru.apk --title "Latest build" \
            --notes "Debug APK built from ${GITHUB_SHA}" --target "${GITHUB_SHA}"
